services:
  redis:
    image: redis:8.0-M02-alpine
    container_name: twivo-redis
    command: >
      redis-server 
      --maxmemory 256mb 
      --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - twivo
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
    # Replaced 'none' with capped logging to prevent blind spots
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    container_name: twivo-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASS}
      - MONGO_INITDB_DATABASE=${MONGO_DB}
    command: ["mongod", "--quiet", "--wiredTigerCacheSizeGB", "0.265"]
    ports:
      - "27017:27017"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - twivo
    healthcheck:
      test: >
        mongosh --quiet --eval "db.adminCommand('ping')" || 
        mongosh --quiet -u "${MONGO_USER}" -p "${MONGO_PASS}" --authenticationDatabase admin --eval "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 5 # Reduced from 10 to speed up backend start
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  media:
    image: twivo-media:latest
    container_name: twivo-media-app
    restart: unless-stopped
    volumes:
      # Use a volume for the public key to avoid formatting issues
      - ./keys/public.pem:/app/keys/public.pem:ro
      - ../twivo-media/media:/app/media:rw
    ports:
      - "8080:8080"
    environment:
    
      - REDIS_URL=tcp://twivo-redis:6379
      - SERVER_PORT=8080
      - SSL_CERT_PATH=${SSL_CERT_PATH}
    depends_on:
      - redis
    networks:
      - twivo

  backend:
    build: .
    image: twivo-backend:latest
    container_name: twivo-backend
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    # Override the command to stay alive so you can work inside it
      # Mount the key file as read-only. 
      # Ensure ./keys/private.pem exists on your host.
      - ./keys/private.pem:/app/keys/private.pem:ro
    command: ["tail", "-f", "/dev/null"]
    environment:
      - DB_URL=${DB_URL}
      - REDIS_URL=redis://twivo-redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_SECRET=${REFRESH_SECRET}
      - BLAKE3_SECRET=${BLAKE3_SECRET}
      # Switch to path-based env for the utility to read
      - ED25519_KEY_PATH=/app/keys/private.pem
      - ED25519_PUBLIC_KEY=${ED25519_PUBLIC_KEY}
      - FRONTEND_URL=${FRONTEND_URL}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - PORT=3000
      - ADDON_ENV=${ADDON_ENV}
      - NODE_ENV=${NODE_ENV}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - MEDIA_SERVICE_URL=http://twivo-media-app:8080
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      media:
        condition: service_started
    networks:
      - twivo
    restart: unless-stopped

  worker:
    build: .
    image: twivo-backend:latest
    container_name: twivo-worker
    volumes:
      - .:/app
    # Override the command to stay alive so you can work inside it
      # Mount the key file as read-only. 
      # Ensure ./keys/private.pem exists on your host.
      - ./keys/private.pem:/app/keys/private.pem:ro
    command: tail -f /dev/null
    environment:
      - DB_URL=${DB_URL}
      - REDIS_URL=redis://twivo-redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_SECRET=${REFRESH_SECRET}
      - ADDON_ENV=${ADDON_ENV}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - BLAKE3_SECRET=${BLAKE3_SECRET}
      - NODE_ENV=${NODE_ENV}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ED25519_KEY_PATH=/app/keys/private.pem
      - ED25519_PUBLIC_KEY=${ED25519_PUBLIC_KEY}
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - twivo
    restart: unless-stopped

networks:
  twivo:
    driver: bridge