services:
  redis:
    image: redis:8.0-M02-alpine
    container_name: twivo-redis
    command: >
      redis-server 
      --requirepass ${REDIS_PASS}
      --maxmemory 256mb 
      --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - twivo
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS}", "ping"]
      interval: 5s
    logging:
      driver: "none"
    restart: unless-stopped
  
  mongodb:
    image: mongo:latest
    container_name: twivo-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASS}
      - MONGO_INITDB_DATABASE=${MONGO_DB}
    command: ["mongod", "--quiet", "--wiredTigerCacheSizeGB", "0.265"]
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - twivo
    healthcheck:
      # This logic: Try pinging without auth (startup phase) 
      # OR try pinging with auth (ready phase).
      test: >
        mongosh --quiet --eval "db.adminCommand('ping')" || 
        mongosh --quiet -u "${MONGO_USER}" -p "${MONGO_PASS}" --authenticationDatabase admin --eval "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 10  # Increased retries to give the init script time to finish
      start_period: 30s # Crucial: Gives Mongo 30s to create the user before failing
    logging:
      driver: "none"
    restart: unless-stopped
  backend:
    build: .
    image: twivo-backend:latest
    container_name: twivo-backend
    ports:
      - "3000:3000"
    environment:
      - DB_URL=${DB_URL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      redis: { condition: service_healthy }
      mongodb: { condition: service_healthy }
    networks:
      - twivo
    restart: unless-stopped

  worker:
    build: .
    image: twivo-backend:latest
    container_name: twivo-worker
    command: node worker/Twi/twi.js
    environment:
      - DB_URL=${DB_URL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      redis: { condition: service_healthy }
      mongodb: { condition: service_healthy }
    networks:
      - twivo
    restart: unless-stopped

networks:
  twivo:
    driver: bridge